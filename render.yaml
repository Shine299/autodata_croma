services:
  - type: web
    name: autodata-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CROMA_MODE
        value: mock
      - key: CROMA_TIMEOUT_SECONDS
        value: "40"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CROMA_API_KEY
        sync: false
