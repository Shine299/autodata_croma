services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autodata-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=dev
      - CROMA_MODE=mock
      - CROMA_TIMEOUT_SECONDS=40
      - DATABASE_URL=sqlite+aiosqlite:///:memory:
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autodata-bot
    environment:
      - PROCESS=bot
      - APP_ENV=dev
      - CROMA_MODE=mock
      - API_BASE_URL=http://api:8000/api/v1
      # Sin token el bot crashea al arrancar con InvalidToken.
      # Se toma del .env local; NO se versiona.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      - api
    restart: unless-stopped
